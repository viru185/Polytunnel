# cargo-about: generates THIRD-PARTY-NOTICES.txt for the installers.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The GUI ships egui's bundled fonts, and Linux builds use ksni for the tray icon.
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]

[ksni]
accepted = ["Unlicense"]
