# The root crate is the `polytunnel` app (tray agent, window and CLI). release-please needs a
# real package at the root; it then bumps every workspace member to the same version.
[package]
name = "polytunnel"
version = "0.1.0"
description = "Lightweight VPN client for GlobalProtect and Fortinet: tray, window and CLI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vpn", "globalprotect", "fortinet", "ipsec", "saml"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
dirs.workspace = true
getrandom.workspace = true
interprocess.workspace = true
lexopt.workspace = true
polytunnel-core.workspace = true
polytunnel-forti.workspace = true
polytunnel-gp.workspace = true
rpassword.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
# Same version interprocess uses, for building security descriptors from SDDL.
widestring = "1.2.1"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
# Listed explicitly (no globs): release-please reads this list to bump every member in lockstep.
members = [
    "crates/polytunnel-core",
    "crates/polytunnel-daemon",
    "crates/polytunnel-forti",
    "crates/polytunnel-gp",
    "xtask",
]
default-members = [
    ".",
    "crates/polytunnel-core",
    "crates/polytunnel-daemon",
    "crates/polytunnel-forti",
    "crates/polytunnel-gp",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/viru185/Polytunnel"

[workspace.dependencies]
# Internal crates (never published, so no version requirement).
polytunnel-core = { path = "crates/polytunnel-core" }
polytunnel-forti = { path = "crates/polytunnel-forti" }
polytunnel-gp = { path = "crates/polytunnel-gp" }

# Shared third-party crates.
base64 = "0.23.1"
dirs = "7.0.0"
form_urlencoded = "1.2"
getrandom = "0.4.3"
interprocess = { version = "2.4.10", default-features = false }
lexopt = "0.3.2"
libc = "0.2"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std", "display"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
windows-sys = "0.61.2"
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Keep debug builds of the GUI responsive.
[profile.dev.package."*"]
opt-level = 2
