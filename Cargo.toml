[workspace]
resolver = "3"
# Listed explicitly (no globs): release-please bumps every member in lockstep and reads this list.
members = [
    "crates/polytunnel-core",
    "crates/polytunnel-app",
    "crates/polytunnel-daemon",
    "xtask",
]
default-members = [
    "crates/polytunnel-core",
    "crates/polytunnel-app",
    "crates/polytunnel-daemon",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/viru185/Polytunnel"

[workspace.dependencies]
# Internal crates (never published, so no version requirement).
polytunnel-core = { path = "crates/polytunnel-core" }

# Shared third-party crates.
lexopt = "0.3.2"
libc = "0.2"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Keep debug builds of the GUI responsive.
[profile.dev.package."*"]
opt-level = 2
