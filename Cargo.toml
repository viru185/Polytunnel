# The root crate is the `polytunnel` app (tray agent, window and CLI). release-please needs a
# real package at the root; it then bumps every workspace member to the same version.
[package]
name = "polytunnel"
version = "0.0.0"
description = "Lightweight VPN client for GlobalProtect and Fortinet: tray, window and CLI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vpn", "globalprotect", "fortinet", "ipsec", "saml"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
lexopt.workspace = true
polytunnel-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
# Listed explicitly (no globs): release-please reads this list to bump every member in lockstep.
members = [
    "crates/polytunnel-core",
    "crates/polytunnel-daemon",
    "xtask",
]
default-members = [
    ".",
    "crates/polytunnel-core",
    "crates/polytunnel-daemon",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/viru185/Polytunnel"

[workspace.dependencies]
# Internal crates (never published, so no version requirement).
polytunnel-core = { path = "crates/polytunnel-core" }

# Shared third-party crates.
lexopt = "0.3.2"
libc = "0.2"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Keep debug builds of the GUI responsive.
[profile.dev.package."*"]
opt-level = 2
