# The root crate is the `polytunnel` app (tray agent, window and CLI). release-please needs a
# real package at the root; it then bumps every workspace member to the same version.
[package]
name = "polytunnel"
version = "0.0.0"
description = "Lightweight VPN client for GlobalProtect and Fortinet: tray, window and CLI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vpn", "globalprotect", "fortinet", "ipsec", "saml"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[package.metadata.deb]
name = "polytunnel"
maintainer = "Polytunnel contributors <https://github.com/viru185/Polytunnel>"
copyright = "Polytunnel contributors"
section = "net"
priority = "optional"
depends = "$auto, systemd"
extended-description = """Lightweight VPN client for Palo Alto GlobalProtect (SAML single sign-on, best-gateway selection) and Fortinet SSL VPN, with a background service that owns the tunnels."""
assets = [
  ["target/release/polytunnel", "usr/bin/", "755"],
  ["target/release/polytunnel-daemon", "usr/bin/", "755"],
  ["packaging/linux/polytunnel.desktop", "usr/share/applications/", "644"],
  ["assets/polytunnel.png", "usr/share/icons/hicolor/256x256/apps/polytunnel.png", "644"],
  ["README.md", "usr/share/doc/polytunnel/README.md", "644"],
]
# cargo-deb writes the scripts that enable and start the service only when
# maintainer-scripts is set; packaging/linux holds no scripts of its own.
maintainer-scripts = "packaging/linux"
systemd-units = { unit-name = "polytunnel-daemon", unit-scripts = "packaging/linux", enable = true, start = true }

[package.metadata.generate-rpm]
summary = "Lightweight VPN client for GlobalProtect and Fortinet"
assets = [
  { source = "target/release/polytunnel", dest = "/usr/bin/polytunnel", mode = "755" },
  { source = "target/release/polytunnel-daemon", dest = "/usr/bin/polytunnel-daemon", mode = "755" },
  { source = "packaging/linux/polytunnel-daemon.service", dest = "/usr/lib/systemd/system/polytunnel-daemon.service", mode = "644" },
  { source = "packaging/linux/polytunnel.desktop", dest = "/usr/share/applications/polytunnel.desktop", mode = "644" },
  { source = "assets/polytunnel.png", dest = "/usr/share/icons/hicolor/256x256/apps/polytunnel.png", mode = "644" },
]
post_install_script = "systemctl daemon-reload; systemctl enable --now polytunnel-daemon.service || true"
pre_uninstall_script = "systemctl disable --now polytunnel-daemon.service || true"

[dependencies]
dirs.workspace = true
eframe.workspace = true
getrandom.workspace = true
interprocess.workspace = true
lexopt.workspace = true
native-tls.workspace = true
polytunnel-core.workspace = true
polytunnel-forti.workspace = true
polytunnel-gp.workspace = true
polytunnel-http.workspace = true
rpassword.workspace = true
serde.workspace = true
socket2.workspace = true
toml.workspace = true
tray-icon.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# Same version interprocess uses, for building security descriptors from SDDL.
widestring.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
tray-icon = { workspace = true, features = ["ksni"] }

[build-dependencies]
ico = "0.6.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true

[workspace]
resolver = "3"
# Listed explicitly (no globs): release-please reads this list to bump every member in lockstep.
members = [
    "crates/polytunnel-core",
    "crates/polytunnel-daemon",
    "crates/polytunnel-esp",
    "crates/polytunnel-forti",
    "crates/polytunnel-gp",
    "crates/polytunnel-http",
    "crates/polytunnel-ike",
    "crates/polytunnel-net",
    "xtask",
]
default-members = [
    ".",
    "crates/polytunnel-core",
    "crates/polytunnel-daemon",
    "crates/polytunnel-esp",
    "crates/polytunnel-forti",
    "crates/polytunnel-gp",
    "crates/polytunnel-http",
    "crates/polytunnel-ike",
    "crates/polytunnel-net",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/viru185/Polytunnel"

[workspace.dependencies]
# Internal crates (never published, so no version requirement).
polytunnel-core = { path = "crates/polytunnel-core" }
polytunnel-esp = { path = "crates/polytunnel-esp" }
polytunnel-forti = { path = "crates/polytunnel-forti" }
polytunnel-gp = { path = "crates/polytunnel-gp" }
polytunnel-http = { path = "crates/polytunnel-http" }
polytunnel-ike = { path = "crates/polytunnel-ike" }
polytunnel-net = { path = "crates/polytunnel-net" }

# Shared third-party crates.
aes = "0.9.4"
tun-rs = { version = "2.8.18", features = ["interruptible"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
cbc = "0.2.1"
crypto-bigint = { version = "0.7.11", default-features = false, features = ["alloc", "zeroize"] }
dirs = "7.0.0"
elliptic-curve = { version = "0.14.3", default-features = false, features = ["sec1"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
form_urlencoded = "1.2"
getrandom = "0.4.3"
hmac = "0.13.0"
interprocess = { version = "2.4.10", default-features = false }
lexopt = "0.3.2"
md5 = { package = "md-5", version = "0.11.0" }
libc = "0.2"
native-tls = "0.2.18"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "alloc"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh", "alloc"] }
rpassword = "7.5.5"
sha1 = "0.11.0"
sha2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-native-tls = "0.3.1"
tray-icon = { version = "0.27.0", default-features = false }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std", "display"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
widestring = "1.2.1"
windows-service = "0.8.1"
windows-sys = "0.61.2"
winit = { version = "0.30.13", default-features = false }
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Keep debug builds of the GUI responsive.
[profile.dev.package."*"]
opt-level = 2
