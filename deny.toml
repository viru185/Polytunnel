# cargo-deny: licences, advisories, bans and sources. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only: the project is MIT and ships static binaries.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
# The GUI ships egui's bundled fonts; Linux builds use ksni for the tray icon.
exceptions = [
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
  { allow = ["Unlicense"], crate = "ksni" },
]

[licenses.private]
# The workspace's own crates are never published; their licence is the repository's MIT.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Polytunnel uses the OS TLS stack (native-tls); OpenSSL is only acceptable as native-tls's
  # Linux backend, never vendored.
  { crate = "openssl-src" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
