[package]
name = "polytunnel-daemon"
version = "0.0.0"
description = "Polytunnel background service: owns tunnels, routes, DNS and the kill switch."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "polytunnel_daemon"
path = "src/lib.rs"

[[bin]]
name = "polytunnel-daemon"
path = "src/main.rs"

[dependencies]
interprocess.workspace = true
lexopt.workspace = true
native-tls.workspace = true
polytunnel-core.workspace = true
polytunnel-esp.workspace = true
polytunnel-gp.workspace = true
polytunnel-http.workspace = true
polytunnel-net.workspace = true
tokio.workspace = true
tokio-native-tls.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
