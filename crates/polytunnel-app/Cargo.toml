[package]
name = "polytunnel-app"
version = "0.0.0"
description = "Polytunnel: lightweight VPN client for GlobalProtect and Fortinet (tray, window and CLI)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "polytunnel_app"
path = "src/lib.rs"

[[bin]]
name = "polytunnel"
path = "src/main.rs"

[dependencies]
lexopt.workspace = true
polytunnel-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
