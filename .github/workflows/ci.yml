name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint-fixtures:
    name: lint-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No real hostnames or IPs in test data
        run: cargo xtask lint-fixtures

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build release
        run: cargo build --locked --release
      - name: Smoke test
        shell: bash
        run: |
          for name in polytunnel polytunnel-daemon; do
            bin=target/release/$name
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" --version
            out=$("$bin" --author)
            grep -q "Viren Hirpara" <<< "$out"
            if LC_ALL=C grep -q '[^[:print:][:space:]]' <<< "$out"; then
              echo "$name --author printed non-ASCII output when piped" >&2
              exit 1
            fi
          done
      - name: Report binary sizes
        shell: bash
        run: |
          for name in polytunnel polytunnel-daemon; do
            bin=target/release/$name
            [ -f "$bin.exe" ] && bin="$bin.exe"
            size=$(wc -c < "$bin")
            echo "$RUNNER_OS $name: $((size / 1024)) KB"
            echo "**$RUNNER_OS** \`$name\`: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          done

  net-integration:
    name: network integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Wintun (pinned, checksum verified)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wintun.zip" https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  $RUNNER_TEMP/wintun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/wintun.zip" -d "$RUNNER_TEMP"
          echo "POLYTUNNEL_WINTUN_DLL=$RUNNER_TEMP/wintun/bin/amd64/wintun.dll" >> "$GITHUB_ENV"
      - name: TUN, routes and DNS round trip (Windows runners are administrators)
        if: runner.os == 'Windows'
        run: cargo test --locked -p polytunnel-net --test system -- --ignored --test-threads=1
      - name: TUN, routes and DNS round trip (as root)
        if: runner.os == 'Linux'
        run: |
          # Cargo reports where it put the test program (not always target/debug/deps).
          bin=$(cargo test --locked -p polytunnel-net --test system --no-run --message-format=json | jq -r 'select(.executable != null and .target.name == "system") | .executable' | tail -1)
          test -x "$bin"
          sudo "$bin" --ignored --test-threads=1

