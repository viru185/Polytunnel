name: Release

# release-please keeps a "chore(main): release x.y.z" PR up to date from the Conventional
# Commits on main. Merging it tags the release; the build jobs then attach the installers
# (packaging/build.sh), checksums and third-party notices.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  notices:
    name: third-party notices
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9
      - name: Generate THIRD-PARTY-NOTICES.txt
        run: cargo about generate --fail packaging/about.hbs -o THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt
      - name: Upload to the GitHub release
        run: gh release upload "$TAG" THIRD-PARTY-NOTICES.txt --clobber

  build:
    name: build ${{ matrix.target }}
    needs: [release-please, notices]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: MSI installer + portable zip. Linux: .deb, .rpm and tarball.
          # macOS (beta): universal .pkg.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
      # Everything that is packaged; the --author smoke test covers the two main programs.
      BINS: polytunnel polytunnel-daemon polytunnel-sso
      # Signing runs only when its secrets exist (see SECURITY.md); releases are unsigned until then.
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      MACOS_SIGNING: ${{ secrets.MACOS_APP_P12 != '' }}
      MACOS_NOTARIZING: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libssl-dev
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3,cargo-generate-rpm@0.21
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: ${{ runner.temp }}/notices
      - name: Build
        shell: bash
        env:
          # The Ed25519 key update manifests must be signed with (docs/releasing.md).
          POLYTUNNEL_UPDATE_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          # Keep build-machine paths out of the binaries (panic messages embed source paths).
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/polytunnel --remap-path-prefix=$HOME=/home"
          if [ "$TARGET" = universal-apple-darwin ]; then
            cargo build --locked --release --target aarch64-apple-darwin
            cargo build --locked --release --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            for name in $BINS; do
              lipo -create -output "target/universal-apple-darwin/release/$name"                 "target/aarch64-apple-darwin/release/$name"                 "target/x86_64-apple-darwin/release/$name"
            done
          else
            cargo build --locked --release --target "$TARGET"
          fi
      - name: Smoke test
        shell: bash
        run: |
          for name in polytunnel polytunnel-daemon; do
            bin=target/$TARGET/release/$name
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" --version
            out=$("$bin" --author)
            grep -q "Viren Hirpara" <<< "$out"
            if LC_ALL=C grep -q '[^[:print:][:space:]]' <<< "$out"; then
              echo "$name --author printed non-ASCII output when piped" >&2
              exit 1
            fi
          done
      - name: Sign the programs (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Import the Developer ID certificates
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        shell: bash
        env:
          APP_P12: ${{ secrets.MACOS_APP_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for name in APP_P12 INSTALLER_P12; do
            [ -n "${!name}" ] || continue
            echo "${!name}" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() { security find-identity -v "$keychain" | grep -m1 "$1" | sed -E 's/.*"(.*)"/\1/'; }
          echo "MACOS_APP_IDENTITY=$(identity 'Developer ID Application')" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_IDENTITY=$(identity 'Developer ID Installer')" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          NOTICES: ${{ runner.temp }}/notices/THIRD-PARTY-NOTICES.txt
        run: packaging/build.sh "$TARGET" "${TAG#v}" dist
      - name: Sign the installer (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          foreach ($file in (Get-ChildItem "target\$env:TARGET\release\*.exe") + (Get-ChildItem dist\*.msi)) {
            & $signtool.FullName verify /pa /q $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($file.Name) is not validly signed" }
          }
      - name: Notarize the macOS package
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true' && env.MACOS_NOTARIZING == 'true'
        shell: bash
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" > "$RUNNER_TEMP/api-key.p8"
          for pkg in dist/*.pkg; do
            xcrun notarytool submit "$pkg" --key "$RUNNER_TEMP/api-key.p8" --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER" --wait
            xcrun stapler staple "$pkg"
          done
          rm -f "$RUNNER_TEMP/api-key.p8"
      - name: Refresh checksums after signing
        shell: bash
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sha256) ;; *)
              if command -v sha256sum > /dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256" ;;
            esac
          done
      - name: Upload to the GitHub release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  publish:
    name: checksums and update manifest
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GPG_SIGNING: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      UPDATE_SIGNING: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the release files
        run: gh release download "$TAG" --dir assets --pattern '*' --clobber
      - name: SHA256SUMS
        run: |
          cd assets
          sha256sum $(ls | grep -v -e '\.sha256$' -e '\.asc$' -e '^SHA256SUMS' -e '^latest\.json') > ../SHA256SUMS
          cat ../SHA256SUMS
      - name: Sign SHA256SUMS (GPG)
        if: env.GPG_SIGNING == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign SHA256SUMS
      - name: Update manifest (latest.json)
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'EOF'
          import hashlib, json, pathlib, sys
          version = sys.argv[1]
          kinds = {
              'windows-x64': f'polytunnel-{version}-windows-x64.msi',
              'windows-arm64': f'polytunnel-{version}-windows-arm64.msi',
              'macos': f'polytunnel-{version}-macos-universal.pkg',
          }
          assets = {}
          for kind, name in kinds.items():
              path = pathlib.Path('assets') / name
              if path.exists():
                  assets[kind] = {'name': name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          manifest = {'version': version, 'assets': assets}
          pathlib.Path('latest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          EOF
          cat latest.json
      - name: Sign the update manifest (Ed25519)
        if: env.UPDATE_SIGNING == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/update-key.pem"
          echo "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in latest.json | base64 -w0 > latest.json.sig
          rm -f "$key"
      - name: Upload
        run: gh release upload "$TAG" SHA256SUMS* latest.json* --clobber
