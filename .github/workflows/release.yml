name: Release

# release-please keeps a "chore(main): release x.y.z" PR up to date from the Conventional
# Commits on main. Merging it tags the release; the build job then attaches the binaries.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build ${{ matrix.asset }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: polytunnel-windows-x86_64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: polytunnel-windows-aarch64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: polytunnel-linux-x86_64.tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: polytunnel-linux-aarch64.tar.gz
          - os: macos-latest
            target: universal-apple-darwin
            asset: polytunnel-macos-universal.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
      BINS: polytunnel polytunnel-daemon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Build
        shell: bash
        run: |
          # Keep build-machine paths out of the binaries (panic messages embed source paths).
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/polytunnel --remap-path-prefix=$HOME=/home"
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            cargo build --locked --release --target aarch64-apple-darwin
            cargo build --locked --release --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            for name in $BINS; do
              lipo -create -output "target/universal-apple-darwin/release/$name" \
                "target/aarch64-apple-darwin/release/$name" \
                "target/x86_64-apple-darwin/release/$name"
            done
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
      - name: Smoke test
        shell: bash
        run: |
          for name in $BINS; do
            bin=target/${{ matrix.target }}/release/$name
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" --version
            out=$("$bin" --author)
            grep -q "Viren Hirpara" <<< "$out"
            if LC_ALL=C grep -q '[^[:print:][:space:]]' <<< "$out"; then
              echo "$name --author printed non-ASCII output when piped" >&2
              exit 1
            fi
          done
      - name: Package
        shell: bash
        run: |
          stage="$RUNNER_TEMP/polytunnel"
          mkdir -p "$stage" dist
          for name in $BINS; do
            bin=target/${{ matrix.target }}/release/$name
            [ -f "$bin.exe" ] && bin="$bin.exe"
            cp "$bin" "$stage/"
          done
          cp README.md LICENSE "$stage/"
          case "${{ matrix.asset }}" in
            *.zip) (cd "$RUNNER_TEMP" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" polytunnel > /dev/null) ;;
            *.tar.gz) tar -C "$RUNNER_TEMP" -czf "dist/${{ matrix.asset }}" polytunnel ;;
          esac
          cd dist
          for f in *; do
            if command -v sha256sum > /dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -l
      - name: Upload to the GitHub release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber
