name: Release

# release-please keeps a "chore(main): release x.y.z" PR up to date from the Conventional
# Commits on main. Merging it tags the release; the build jobs then attach the installers
# (packaging/build.sh), checksums and third-party notices.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  notices:
    name: third-party notices
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9
      - name: Generate THIRD-PARTY-NOTICES.txt
        run: cargo about generate --fail packaging/about.hbs -o THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt
      - name: Upload to the GitHub release
        run: gh release upload "$TAG" THIRD-PARTY-NOTICES.txt --clobber

  build:
    name: build ${{ matrix.target }}
    needs: [release-please, notices]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: MSI installer + portable zip. Linux: .deb, .rpm and tarball.
          # macOS (beta): universal .pkg.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
      # Everything that is packaged; the --author smoke test covers the two main programs.
      BINS: polytunnel polytunnel-daemon polytunnel-sso
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libssl-dev
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3,cargo-generate-rpm@0.21
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: ${{ runner.temp }}/notices
      - name: Build
        shell: bash
        run: |
          # Keep build-machine paths out of the binaries (panic messages embed source paths).
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/polytunnel --remap-path-prefix=$HOME=/home"
          if [ "$TARGET" = universal-apple-darwin ]; then
            cargo build --locked --release --target aarch64-apple-darwin
            cargo build --locked --release --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            for name in $BINS; do
              lipo -create -output "target/universal-apple-darwin/release/$name"                 "target/aarch64-apple-darwin/release/$name"                 "target/x86_64-apple-darwin/release/$name"
            done
          else
            cargo build --locked --release --target "$TARGET"
          fi
      - name: Smoke test
        shell: bash
        run: |
          for name in polytunnel polytunnel-daemon; do
            bin=target/$TARGET/release/$name
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" --version
            out=$("$bin" --author)
            grep -q "Viren Hirpara" <<< "$out"
            if LC_ALL=C grep -q '[^[:print:][:space:]]' <<< "$out"; then
              echo "$name --author printed non-ASCII output when piped" >&2
              exit 1
            fi
          done
      - name: Package
        shell: bash
        env:
          NOTICES: ${{ runner.temp }}/notices/THIRD-PARTY-NOTICES.txt
        run: packaging/build.sh "$TARGET" "${TAG#v}" dist
      - name: Upload to the GitHub release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber
