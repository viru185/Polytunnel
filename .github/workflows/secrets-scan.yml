name: Secrets scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Self-test (the rules must catch fake session secrets)
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          # Random values made at run time: nothing secret-looking is ever committed.
          printf 'authcookie=%s\n' "$(openssl rand -hex 16)" > "$canary/gp.txt"
          printf 'SVPNCOOKIE=%s\n' "$(openssl rand -hex 24)" > "$canary/forti.txt"
          printf 'psk = "%s"\n' "$(openssl rand -hex 16)" > "$canary/psk-quoted.txt"
          printf 'PSK=%s\n' "$(openssl rand -hex 16)" > "$canary/psk-bare.txt"
          for file in gp.txt forti.txt psk-quoted.txt psk-bare.txt; do
            if gitleaks dir "$canary/$file" --config .gitleaks.toml --no-banner --redact; then
              echo "::error::gitleaks did not flag the canary in $file"
              exit 1
            fi
          done
      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --no-banner --redact --verbose .
